# legacy 스택의 coupon 식별자와 Evidence 설정(팀원 legacy/order-otel.yaml과 같은 형태). legacy/new는 이 값과 이미지만 다르다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon
spec:
  template:
    spec:
      containers:
        - name: coupon
          env:
            - name: OTEL_SERVICE_NAME
              value: coupon-legacy
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=pm-legacy
            - name: EVIDENCE_STORE_URL
              value: http://evidence-store.verify.svc.cluster.local:8080
            - name: EVIDENCE_STACK
              value: legacy
            - name: EVIDENCE_SERVICE
              value: coupon
            - name: EVIDENCE_VERSION
              # 팀원과 같은 표식: legacy = Legacy 코드, new의 A/A = legacy-eq. 결함 변형은 PF<n>로 바꾼다
              value: legacy
            # Evidence POST(java.net.http.HttpClient) 계측만 끈다. Feign, RestClient 호출은 계속 계측된다.
            - name: OTEL_INSTRUMENTATION_JAVA_HTTP_CLIENT_ENABLED
              value: "false"
      volumes:
        - name: evidence-spill
          hostPath:
            path: /var/evidence/spill/legacy
            type: DirectoryOrCreate
