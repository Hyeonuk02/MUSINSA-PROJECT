# Prince Mart 미러링 (Compose 임시 전달 레이어)
#
# k8s로 합칠 때 이 파일은 Istio VirtualService(route -> legacy, mirror -> new)로 바뀐다.
# 그래서 VirtualService가 하는 일만 한다:
#   - 경로별 라우팅: /orders -> order, /coupons -> coupon, /payments -> payment
#   - 같은 요청을 new에도 보낸다(mirror). 클라이언트는 legacy 응답만 받는다.
#   - 헤더는 복사만 한다. X-Replay-Request-Id, X-Run-Id, X-Session-Id, baggage는 클라이언트(k6)가 넣고
#     nginx는 ID를 만들지 않는다.
#   - Host는 원본 그대로 양쪽에 보낸다(hyeonuk-dev D8: Istio 1.31은 미러 Host를 바꾸지 않는다).
#     nginx 기본값은 Host를 upstream 이름으로 바꾸므로 legacy/new가 달라진다 -> 명시적으로 막는다.
#
# 이름 해석: nginx는 legacy·new 두 네트워크에 붙어 있다. 짧은 이름(order)은 두 네트워크에 모두 있어
# 모호하므로 서비스 이름(order-legacy, order-new)으로 찾는다.
# 성능 튜닝 값은 바꾸지 않는다(이미지 기본 nginx.conf 사용, Phase 0과 같은 원칙).

log_format mirror '$time_iso8601 "$request" status=$status '
                  'replay=$http_x_replay_request_id run=$http_x_run_id session=$http_x_session_id '
                  'upstream=$upstream_addr rt=$request_time';

upstream order_legacy   { server order-legacy:8085; }
upstream order_new      { server order-new:8085; }
upstream coupon_legacy  { server coupon-legacy:8091; }
upstream coupon_new     { server coupon-new:8091; }
upstream payment_legacy { server payment-legacy:8086; }
upstream payment_new    { server payment-new:8086; }

server {
    listen 80;
    access_log /var/log/nginx/access.log mirror;

    # 양쪽 모두 클라이언트가 보낸 Host를 그대로 받는다(D8).
    proxy_set_header Host $http_host;

    location /orders/ {
        mirror /_mirror/order;
        mirror_request_body on;
        proxy_pass http://order_legacy;
    }
    location = /_mirror/order {
        internal;
        proxy_pass http://order_new$request_uri;
    }

    location /coupons/ {
        mirror /_mirror/coupon;
        mirror_request_body on;
        proxy_pass http://coupon_legacy;
    }
    location = /_mirror/coupon {
        internal;
        proxy_pass http://coupon_new$request_uri;
    }

    location /payments/ {
        mirror /_mirror/payment;
        mirror_request_body on;
        proxy_pass http://payment_legacy;
    }
    location = /_mirror/payment {
        internal;
        proxy_pass http://payment_new$request_uri;
    }

    # API 경로만 받는다.
    location / {
        return 404;
    }
}
