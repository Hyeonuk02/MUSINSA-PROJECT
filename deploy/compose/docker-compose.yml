# Prince Mart 실험 스택 (Compose 임시 실행 환경)
#
# k8s(deploy/k8s)로 합칠 때 1:1로 옮겨지도록 구성한다.
#   - 스택 = 네트워크 하나(k8s 네임스페이스에 대응). 스택 안에서는 짧은 이름
#     (order, coupon, payment, mysql-order, ..., wiremock, kafka)으로 서로를 찾는다.
#     그래서 legacy/new 컨테이너의 env가 완전히 같다.
#   - 서비스 정의는 x-* 템플릿 하나를 두 스택이 공유한다. 스택마다 다른 것은 네트워크뿐이다.
#   - new는 internal 네트워크다(외부로 나갈 수 없음, k8s의 default-deny egress NetworkPolicy에 대응).
#   - 베이스라인(A/A)에서는 new도 Legacy 이미지를 쓴다.
#   - MySQL·Kafka 데이터는 tmpfs에만 있다. 컨테이너 재생성 = S0 리셋(k8s emptyDir + Recreate와 같은 의미).
#     스키마는 mysql-initdb/<service>/ 의 init SQL 하나가 소유한다(hyeonuk-dev D4).
#
# 실행: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
# 리셋: deploy/compose/reset.sh legacy new

name: prince-mart

x-mysql: &mysql
  image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
  # 메모리만 줄이는 설정. 동작(SQL 의미, 문자셋, 격리 수준)은 기본값 그대로다(legacy-decision-log L4).
  # redo log 기본 100MB가 tmpfs(메모리)에 올라가므로 최소값 8MB로 줄인다.
  command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--innodb-redo-log-capacity=8M"]
  tmpfs:
    - /var/lib/mysql
  healthcheck:
    # -h 127.0.0.1로 TCP를 강제한다. init SQL 실행 중에는 이미지가 --skip-networking으로
    # 임시 서버를 띄우므로 이 ping이 실패한다. 즉 healthy = "스키마까지 준비됨"(hyeonuk-dev D3).
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
    interval: 2s
    timeout: 3s
    retries: 60

x-mysql-env: &mysql-env
  MYSQL_ROOT_PASSWORD: root
  MYSQL_USER: pm
  MYSQL_PASSWORD: pm

x-mysql-order: &mysql-order
  <<: *mysql
  environment:
    <<: *mysql-env
    MYSQL_DATABASE: order_db
  volumes:
    - ./mysql-initdb/order:/docker-entrypoint-initdb.d:ro

x-mysql-coupon: &mysql-coupon
  <<: *mysql
  environment:
    <<: *mysql-env
    MYSQL_DATABASE: coupon_db
  volumes:
    - ./mysql-initdb/coupon:/docker-entrypoint-initdb.d:ro

x-mysql-payment: &mysql-payment
  <<: *mysql
  environment:
    <<: *mysql-env
    MYSQL_DATABASE: payment_db
  volumes:
    - ./mysql-initdb/payment:/docker-entrypoint-initdb.d:ro

# 앱 공통 env. 스택마다 값이 같다(이름 해석이 스택 네트워크 안에서 일어나므로).
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: local
  # 두 스택 모두 같은 고정 시각(ClockConfig). 쿠폰 만료 판정과 모든 생성 시각이 이 값을 기준으로 한다.
  APP_FIXED_CLOCK: "2026-09-01T00:00:00Z"
  DB_USER: pm
  DB_PASSWORD: pm
  ORDER_DB_URL: jdbc:mysql://mysql-order:3306/order_db?serverTimezone=UTC
  COUPON_DB_URL: jdbc:mysql://mysql-coupon:3306/coupon_db?serverTimezone=UTC
  PAYMENT_DB_URL: jdbc:mysql://mysql-payment:3306/payment_db?serverTimezone=UTC
  # 스택 내부 서비스
  ORDER_SERVICE_URI: http://order:8085
  COUPON_SERVICE_URI: http://coupon:8091
  PAYMENT_SERVICE_URI: http://payment:8086
  # 스택 밖 의존성 -> 전부 WireMock
  CART_SERVICE_URI: http://wiremock:8080
  IDENTITY_SERVICE_URI: http://wiremock:8080
  INVENTORY_SERVICE_URI: http://wiremock:8080
  AUDIT_SERVICE_URI: http://wiremock:8080
  SHIPPING_SERVICE_URI: http://wiremock:8080
  NOTIFICATION_SERVICE_URI: http://wiremock:8080
  # 가짜 PG (payment local profile의 payment-gateway.type=fake). Razorpay SDK는 쓰지 않으므로 키가 필요 없다.
  PAYMENT_GATEWAY_URL: http://wiremock:8080
  # 스택마다 브로커 하나(스택 네트워크의 kafka). 토픽·group 이름이 두 스택에서 같다.
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-app-health: &app-health
  interval: 3s
  timeout: 3s
  retries: 60
  start_period: 20s

# 앱 이미지는 legacy 서비스에서 한 번 빌드하고 new는 같은 이미지를 쓴다(pull_policy: never).
x-order: &order
  image: prince-mart/order-service:legacy
  pull_policy: never
  environment:
    <<: *app-env
  healthcheck:
    <<: *app-health
    # actuator 의존성이 없으므로(upstream pom) 포트가 열렸는지로 본다(hyeonuk-dev order와 같은 방식).
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085'"]

x-coupon: &coupon
  image: prince-mart/coupon-service:legacy
  pull_policy: never
  environment:
    <<: *app-env
  healthcheck:
    <<: *app-health
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8091'"]

x-payment: &payment
  image: prince-mart/payment-service:legacy
  pull_policy: never
  environment:
    <<: *app-env
  healthcheck:
    <<: *app-health
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8086'"]

x-wiremock: &wiremock
  # wiremock/wiremock:3.13.1 (hyeonuk-dev deploy/k8s/new/wiremock.yaml과 같은 digest)
  image: wiremock/wiremock@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0
  command: ["--disable-banner"]
  volumes:
    - ./wiremock/mappings:/home/wiremock/mappings:ro
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/__admin/health >/dev/null"]
    interval: 2s
    timeout: 3s
    retries: 60

x-kafka: &kafka
  # apache/kafka:4.3.1 (KRaft 단일 노드)
  image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
  # 데이터는 tmpfs에만 있다. 컨테이너 재생성 = 토픽·offset·consumer group 초기화(MySQL S0와 같은 방식).
  tmpfs:
    - /var/lib/kafka/data:mode=1777   # 이미지가 비root(appuser)로 실행된다
  # 브로커를 띄운 뒤 토픽을 만든다. healthy = "토픽까지 준비됨"(MySQL의 healthy = 스키마까지 준비됨과 같은 의미).
  entrypoint: ["/bin/bash", "/opt/init/init-topics.sh"]
  volumes:
    - ./kafka/init-topics.sh:/opt/init/init-topics.sh:ro
  environment:
    CLUSTER_ID: cHJpbmNlLW1hcnQta2ZrMQ   # base64url("prince-mart-kfk1"). 고정값이라 재생성해도 같은 클러스터 ID
    KAFKA_NODE_ID: 1
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # 토픽은 init-topics.sh가 명시적으로 만든다. 오타난 토픽이 조용히 생기지 않게 자동 생성은 끈다.
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic payment-events >/dev/null 2>&1"]
    interval: 2s
    timeout: 10s
    retries: 60
    start_period: 10s

services:
  # ---------------------------------------------------------------- legacy stack
  # 개발 편의로 앱·WireMock 포트를 호스트에 연다(tools/scenarios.py). 비교 트래픽은 nginx를 거친다.
  mysql-order-legacy:
    <<: *mysql-order
    networks: { legacy: { aliases: [mysql-order] } }

  mysql-coupon-legacy:
    <<: *mysql-coupon
    networks: { legacy: { aliases: [mysql-coupon] } }

  mysql-payment-legacy:
    <<: *mysql-payment
    networks: { legacy: { aliases: [mysql-payment] } }

  wiremock-legacy:
    <<: *wiremock
    ports: ["8089:8080"]
    networks: { legacy: { aliases: [wiremock] } }

  kafka-legacy:
    <<: *kafka
    networks: { legacy: { aliases: [kafka] } }

  order-legacy:
    <<: *order
    build:
      context: ../../legacy/prince-mart/order-service
      dockerfile: DockerFile
    ports: ["8085:8085"]
    depends_on:
      mysql-order-legacy: { condition: service_healthy }
      kafka-legacy: { condition: service_healthy }
    networks: { legacy: { aliases: [order] } }

  coupon-legacy:
    <<: *coupon
    build:
      context: ../../legacy/prince-mart/coupon-service
      dockerfile: DockerFile
    ports: ["8091:8091"]
    depends_on:
      mysql-coupon-legacy: { condition: service_healthy }
    networks: { legacy: { aliases: [coupon] } }

  payment-legacy:
    <<: *payment
    build:
      context: ../../legacy/prince-mart/payment-service
      dockerfile: DockerFile
    ports: ["8086:8086"]
    depends_on:
      mysql-payment-legacy: { condition: service_healthy }
      kafka-legacy: { condition: service_healthy }
    networks: { legacy: { aliases: [payment] } }

  # ---------------------------------------------------------------- new stack
  # legacy와 같은 템플릿·같은 이미지. internal 네트워크라 호스트 포트를 열 수 없다(열 필요도 없다).
  mysql-order-new:
    <<: *mysql-order
    networks: { new: { aliases: [mysql-order] } }

  mysql-coupon-new:
    <<: *mysql-coupon
    networks: { new: { aliases: [mysql-coupon] } }

  mysql-payment-new:
    <<: *mysql-payment
    networks: { new: { aliases: [mysql-payment] } }

  wiremock-new:
    <<: *wiremock
    networks: { new: { aliases: [wiremock] } }

  kafka-new:
    <<: *kafka
    networks: { new: { aliases: [kafka] } }

  order-new:
    <<: *order
    depends_on:
      order-legacy: { condition: service_started }   # 이미지 빌드가 legacy 쪽에서 먼저 끝나야 한다
      mysql-order-new: { condition: service_healthy }
      kafka-new: { condition: service_healthy }
    networks: { new: { aliases: [order] } }

  coupon-new:
    <<: *coupon
    depends_on:
      coupon-legacy: { condition: service_started }
      mysql-coupon-new: { condition: service_healthy }
    networks: { new: { aliases: [coupon] } }

  payment-new:
    <<: *payment
    depends_on:
      payment-legacy: { condition: service_started }
      mysql-payment-new: { condition: service_healthy }
      kafka-new: { condition: service_healthy }
    networks: { new: { aliases: [payment] } }

  # ---------------------------------------------------------------- shared (스택 밖 공용 컴포넌트)
  # 전달 레이어. k8s에서는 Istio Ingress Gateway + VirtualService가 이 역할을 한다.
  nginx:
    image: nginx:1.30@sha256:0aa2d81d65bc0cac0407e738b8f07d312c8685a84225fcb4db7bcbdd8c9bdf11
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8000:80"]
    depends_on:
      order-legacy: { condition: service_healthy }
      coupon-legacy: { condition: service_healthy }
      payment-legacy: { condition: service_healthy }
      order-new: { condition: service_healthy }
      coupon-new: { condition: service_healthy }
      payment-new: { condition: service_healthy }
    networks: [legacy, new]

networks:
  legacy: {}
  # 외부로 나갈 수 없는 네트워크. 허용되는 상대는 같은 네트워크에 붙은 컨테이너뿐이다
  # (new 스택 자신 + 이후 붙일 공용 컴포넌트: nginx, OTel Collector, Evidence Store).
  new:
    internal: true
