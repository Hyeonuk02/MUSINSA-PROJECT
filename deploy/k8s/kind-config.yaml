# Phase 1.1 - kind 클러스터 정의
#
# node 이미지는 digest까지 고정한다. kind 릴리스마다 같은 태그로 다른
# 이미지가 올라가므로 태그만으로는 재현되지 않는다.
#
# 버전 선택 근거 (docs/phase1-result.md 참조)
#   kind        v0.33.0   - NetworkPolicy를 지원하는 kindnetd (>= v0.25 요구)
#   Kubernetes  v1.35.8   - Istio 1.31 지원 범위(1.32~1.36) 안
#   Istio       1.31.1    - 1.2에서 설치
#
# Ingress 진입점 (1.6, 그리고 Phase 2의 k6)
#   kind에는 LoadBalancer 구현이 없으므로 Istio Ingress Gateway를 NodePort로
#   노출하고, 노드의 그 포트를 호스트 80/443에 매핑한다. 클러스터 밖에서
#   http://localhost/ 로 바로 들어올 수 있고 port-forward 프로세스에 의존하지 않는다.
#     host 80  -> node 30080 -> istio-ingressgateway :80
#     host 443 -> node 30443 -> istio-ingressgateway :443
#   ingress-ready=true 라벨은 게이트웨이를 이 노드에 고정하기 위한 것이다
#   (kind의 ingress 표준 패턴).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: musinsa-phase1
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
