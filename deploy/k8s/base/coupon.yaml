# Phase 3.2 - Coupon 앱 (services/coupon). order.yaml과 같은 구성(OTel agent·상한·spill·graceful)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon
  labels:
    app: coupon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coupon
  template:
    metadata:
      labels:
        app: coupon
    spec:
      # Phase 2.4: 앱 graceful shutdown(20s/phase) + Evidence drain(10s)보다 길게.
      terminationGracePeriodSeconds: 30
      initContainers:
        # OTel Java agent를 공유 emptyDir로 복사한다.
        #
        # 기동 중 인터넷에서 jar를 받아오지 않는다. 1.5에서 new에 default-deny egress
        # NetworkPolicy와 REGISTRY_ONLY가 걸리면 다운로드 방식은 그 순간 깨진다.
        # 또 매번 받아오면 legacy와 new가 같은 agent라는 보장이 없어져,
        # 관측 결과 차이가 코드 차이인지 도구 차이인지 구분되지 않는다.
        # 이 이미지는 digest로 고정하고 legacy/new가 동일한 것을 쓴다.
        - name: otel-agent
          # ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.31.1
          # java가 없는 복사 전용 이미지다. /javaagent.jar 하나만 들어 있다.
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java@sha256:342ad4c72909bb92b7cd6fa09d5fdd50f41879b5657329e729baeacb46d9a02e
          imagePullPolicy: IfNotPresent
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
        # MySQL이 TCP를 열기 전(= init SQL 실행 중)에는 앱을 띄우지 않는다.
        # 앱은 기동 시 커넥션을 잡으므로 먼저 뜨면 CrashLoopBackOff가 된다.
        - name: wait-for-coupon-mysql
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z coupon-mysql 3306; do echo "waiting for coupon-mysql:3306"; sleep 2; done
      containers:
        - name: coupon
          image: coupon-app:phase3.2-base
          # 이미지는 kind load로 노드 안에만 있다. 레지스트리에서 받으려 하면 안 된다.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:mysql://coupon-mysql:3306/coupons?serverTimezone=UTC
            - name: DB_USER
              value: poc
            - name: DB_PASSWORD
              value: poc
            - name: EVIDENCE_HEADERS
              # Phase 2.4: Evidence(request/response.headers)에 남길 헤더. 로그용 목록과 분리한다.
              # x-request-id·Host는 넣지 않는다 — 실행 시점 값이라 판정 잡음이 된다.
              # Phase 3.1: X-Replay-Hop-Path 추가(Evidence 키의 일부, D15).
              value: X-Replay-Request-Id,X-Run-Id,X-Session-Id,X-Replay-Hop-Path,Idempotency-Key,Content-Type
            - name: EVIDENCE_APP_PACKAGES
              # Phase 3.1: callTree 수집 대상 패키지(poc.evidence 자신·필터·@Configuration은 제외). error.where 판단에도 쓴다.
              value: poc.coupon
            - name: JAVA_TOOL_OPTIONS
              # JVM이 시작할 때 "Picked up JAVA_TOOL_OPTIONS: ..."를 stderr에 찍는다.
              # agent가 실제로 붙었는지 앱 로그로 확인하는 근거다.
              # Phase 3.1(D-2): heap·metaspace 상한. Phase 3에서 Coupon·Kafka가 같은 노드에 올라오므로 기본값(컨테이너 메모리의 1/4)에 맡기지 않는다.
              value: -javaagent:/otel/javaagent.jar -Xmx384m -XX:MaxMetaspaceSize=128m
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_SAMPLER
              # 샘플링 100%. Istio 쪽은 Telemetry의 randomSamplingPercentage로 맞춘다.
              value: always_on
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PROPAGATORS
              # Envoy가 어느 포맷으로 컨텍스트를 넘기든 앱이 이어받도록 넓게 받는다.
              # 이게 맞아야 Envoy span과 앱 span이 한 trace가 된다.
              value: tracecontext,baggage,b3,b3multi
            # OTEL_SERVICE_NAME / OTEL_RESOURCE_ATTRIBUTES는 legacy/new overlay에서 지정한다.
            - name: APP_FIXED_CLOCK
              # legacy/new 모두 같은 값. 시각 차이가 Evidence 비교에 섞이지 않게 한다.
              value: "2026-09-01T00:00:00Z"
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
              readOnly: true
            - name: evidence-spill
              mountPath: /var/evidence/spill
          resources:
            # Phase 3.1(D-2): legacy/new 동일(base). limits는 heap 384m + metaspace 128m + 코드 캐시·스레드·OTel agent 여유
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 768Mi
          readinessProbe:
            # Tomcat은 기동 마지막에 포트를 연다. actuator를 넣지 않기 위해 TCP로 본다.
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 40
      volumes:
        - name: otel-agent
          emptyDir: {}
        # Phase 2.4: Evidence 전송 실패분(spill). pod가 교체(rollout restart)돼도 남아야 회수할 수 있어
        # emptyDir이 아니라 노드 hostPath다. 노드 경로는 overlay가 스택별로 덮어쓴다
        # (legacy → /var/evidence/spill/legacy, new → /var/evidence/spill/new) — 두 스택이 노드 디렉터리도 공유하지 않는다.
        # 컨테이너 안 경로는 둘 다 /var/evidence/spill. base 값은 overlay 없이 배포될 때의 자리표시자.
        # kind 노드 1개 전제(노드가 여럿이면 pod가 다른 노드에 떠 회수가 어긋난다). 운영이면 PVC.
        - name: evidence-spill
          hostPath:
            path: /var/evidence/spill/unset
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: coupon
spec:
  selector:
    app: coupon
  ports:
    - name: http
      port: 8080
      targetPort: 8080
