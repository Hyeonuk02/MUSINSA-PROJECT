# Phase 3.3 - Kafka 브로커 (스택별 1노드, KRaft combined broker+controller, D19)
#
# 데이터(로그·오프셋·컨슈머 그룹)는 emptyDir에만 있다. `kubectl rollout restart deployment/kafka`가 곧 S0 리셋이다.
# auto.create.topics.enable=false — 토픽(order.paid, order.paid.dlq, 각 partition 1)은 run.sh가 리셋 뒤에 만든다.
# CLUSTER_ID 고정(스택마다 같은 값이지만 서로 다른 브로커 — 클러스터 id는 스택 구분에 쓰지 않는다).
# advertised listener는 같은 ns의 Service 이름(kafka:9092) — 클라이언트는 같은 스택 안에서만 붙는다(kafka-networkpolicy.yaml).
# 이미지는 kind load로만 존재(apache/kafka:4.2.1). 클라이언트(spring-kafka) kafka-clients도 4.2.1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          # kind load image-archive로 넣은 arm64 이미지(호스트에서 받은 apache/kafka:4.2.1, index digest
          # sha256:9916d60e…). digest로 참조하면 노드가 레지스트리에서 받으려 하므로 태그 + IfNotPresent. 실제 imageRef는 run-meta에 기록.
          image: apache/kafka:4.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-kafka
              containerPort: 9092
          env:
            - name: CLUSTER_ID
              value: phase3-kafka-cluster-1
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://localhost:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xmx256m -Xms128m
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 40
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    # Istio는 포트 이름 접두사로 프로토콜을 판별한다(tcp-).
    - name: tcp-kafka
      port: 9092
      targetPort: 9092
