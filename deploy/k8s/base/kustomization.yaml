# Phase 1.3a - Order + MySQL 공통 base (2.1에서 WireMock, 2.3 전에 mysql NetworkPolicy 추가)
#
# base에는 네임스페이스를 두지 않는다. legacy / new overlay가 namespace만 다르게 지정해
# 같은 매니페스트를 두 번 배포한다 (두 스택은 구성이 동일해야 비교가 성립한다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - mysql.yaml
  - order.yaml
  - wiremock.yaml
  - mysql-networkpolicy.yaml
  # Phase 3.2 - Coupon 서비스와 전용 DB
  - coupon.yaml
  - coupon-mysql.yaml
  - coupon-mysql-networkpolicy.yaml
  - coupon-networkpolicy.yaml
  # Phase 3.3 - Kafka(스택별 1브로커)
  - kafka.yaml
  - kafka-networkpolicy.yaml

configMapGenerator:
  - name: mysql-initdb
    files:
      - mysql-initdb/schema.sql
  - name: coupon-mysql-initdb
    files:
      - coupon-mysql-initdb/schema.sql
  - name: wiremock-mappings
    files:
      - wiremock-mappings/ping.json
      - wiremock-mappings/gateway-charge.json
      - wiremock-mappings/gateway-charge-slow.json
