# WireMock - 결제 게이트웨이 스텁 (legacy / new 공통)
#
# Phase 1.5에서 new 전용(격리 검증의 "허용된 목적지")으로 만들었고,
# Phase 2.1에서 base로 옮겨 legacy / new가 같은 매니페스트·같은 스텁을 쓴다.
# 스텁이 한 곳에만 있어야 두 스택의 외부 응답이 어긋나지 않는다.
#
# 스텁 (wiremock-mappings/, configMapGenerator)
#   GET  /ping            1.5 격리 검증용
#   POST /gateway/charge  2.1 결제. transactionId = "tx-" + Idempotency-Key 헤더.
#                         random 금지 -- legacy/new가 같은 키로 같은 값을 받아야 한다.
#                         stub 단위 "transformers": ["response-template"]로 템플릿을 켠다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  labels:
    app: wiremock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiremock
  template:
    metadata:
      labels:
        app: wiremock
    spec:
      containers:
        - name: wiremock
          # wiremock/wiremock:3.13.1
          image: wiremock/wiremock@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0
          imagePullPolicy: IfNotPresent
          args: ["--disable-banner"]
          ports:
            - name: http-wiremock
              containerPort: 8080
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
              readOnly: true
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 40
      volumes:
        - name: mappings
          configMap:
            name: wiremock-mappings
---
apiVersion: v1
kind: Service
metadata:
  name: wiremock
spec:
  selector:
    app: wiremock
  ports:
    # 포트 이름은 Istio 프로토콜 판별 규칙(접두사)을 따른다 - 1.4에서 겪은 문제.
    - name: http-wiremock
      port: 8080
      targetPort: 8080
