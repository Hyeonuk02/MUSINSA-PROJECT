# Phase 3.2 - Coupon 격리 실측용 probe pod (mysql-probe.yaml과 같은 방식)
#
# app=order / app=coupon 레이블로 NetworkPolicy 허용 대상을 흉내 낸다. 같은 레이블의 Service endpoint에
# 들어가지 않도록 readinessProbe를 항상 실패시킨다. 이미지는 노드에 이미 있는 것만(curlimages/curl, mysql:8.4).
#   *-curl  : HTTP 8080 시도 (coupon.<ns>)
#   *-mysql : MySQL 3306 로그인 시도 (coupon-mysql.<ns>)
apiVersion: v1
kind: Pod
metadata:
  name: cprobe-order-curl
  namespace: legacy
  labels:
    app: order
    role: cprobe
spec:
  containers:
    - name: client
      image: curlimages/curl:8.11.1
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      readinessProbe:
        exec:
          command: ["false"]
---
