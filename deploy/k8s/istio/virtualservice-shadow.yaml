# Phase 1.6 - Shadow 미러링 / Phase 2.3 - Evidence Store 진입 경로
#
# Istio는 http 라우트를 위에서부터 순서대로 매칭한다. 순서가 곧 의미다.
#   1. /_evidence/  -> verify/evidence-store (mirror 없음). 호스트의 k6·run script가 쓰는 경로.
#                      반드시 mirror 라우트보다 앞에 둔다 — 뒤에 두면 catch-all에 먼저 걸려
#                      legacy order로 가고 new로 미러된다.
#   2. (그 외 전부) -> legacy route + new mirror
#
# 미러는 fire-and-forget이다. new의 응답은 버려지고 클라이언트는 legacy 응답만 받는다.
# 미러 요청의 Host에는 접미사가 붙지 않는다(Istio 1.31 기본값, decision-log D8).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: order-shadow
  namespace: istio-system
spec:
  hosts:
    - "*"
  gateways:
    - order-gateway
  http:
    - name: evidence-store
      match:
        - uri:
            prefix: /_evidence/
      rewrite:
        uri: /
      route:
        - destination:
            host: evidence-store.verify.svc.cluster.local
            port:
              number: 8080
    - name: order-shadow
      route:
        - destination:
            host: order.legacy.svc.cluster.local
            port:
              number: 8080
      mirror:
        host: order.new.svc.cluster.local
        port:
          number: 8080
      mirrorPercentage:
        # 모든 요청을 미러한다.
        value: 100.0
