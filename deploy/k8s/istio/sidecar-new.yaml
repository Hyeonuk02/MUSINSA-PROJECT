# Phase 1.5 - new 네임스페이스의 egress 허용 목록 (guardrail)
#
# Sidecar 리소스는 sidecar가 알고 있는 목적지를 좁힌다.
# REGISTRY_ONLY와 합쳐지면, 여기 없는 목적지로 나가는 트래픽은 BlackHoleCluster로 떨어진다.
#
# 다시 강조: 이것은 경계가 아니다. sidecar를 우회하면 그만이다.
# 경계는 networkpolicy.yaml이고, 이 파일은 미등록 의존성을 드러내는 용도다.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: new
spec:
  egress:
    - hosts:
        - "./*"              # 같은 네임스페이스 (Order, MySQL, WireMock)
        - "istio-system/*"   # istiod xDS
        - "observability/*"  # OTel Collector
        - "verify/*"         # Phase 2 검증 컴포넌트
