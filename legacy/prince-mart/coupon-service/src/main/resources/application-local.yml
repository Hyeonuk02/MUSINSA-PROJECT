# [LEGACY_CHANGES L-C2] 실험 환경용 local profile (설정 등급, SPRING_PROFILES_ACTIVE=local)
#
# application.yml(upstream)은 그대로 두고 이 파일이 덮어쓴다.
# - DB: Postgres -> MySQL 8.4. 스키마 소유자는 MySQL init SQL 하나다(ddl-auto none, sql.init never).
# - Eureka를 끄고 Feign 대상 주소를 simple discovery로 고정한다. 주소는 env로 받아
#   legacy/new가 같은 파일을 쓴다.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    discovery:
      client:
        simple:
          instances:
            "[ORDER-SERVICE]":
              - uri: ${ORDER_SERVICE_URI}
            "[AUDIT-SERVICE]":
              - uri: ${AUDIT_SERVICE_URI}

eureka:
  client:
    enabled: false

# [LEGACY_CHANGES L-I1] 시각 고정. 비어 있으면 시스템 시각(UTC). config/ClockConfig 참조.
app:
  fixed-clock: ${APP_FIXED_CLOCK:}

# [LEGACY_CHANGES L-I2] Evidence 계측(com.pm.evidence, 자동 구성). Store 주소와 스택 이름은 env로 받는다.
evidence:
  enabled: ${EVIDENCE_ENABLED:true}
  store-url: ${EVIDENCE_STORE_URL:}
  stack: ${EVIDENCE_STACK:}
  service: coupon
  headers: Content-Type,X-User-Id,X-Replay-Request-Id,X-Run-Id,X-Session-Id,baggage,Host,Idempotency-Key
# DB 접근: Hibernate가 준비하는 SQL을 요청 단위로 기록한다(SQL은 바꾸지 않음).
spring.jpa.properties.hibernate.session_factory.statement_inspector: com.pm.evidence.EvidenceStatementInspector
