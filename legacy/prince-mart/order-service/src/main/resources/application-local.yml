# [LEGACY_CHANGES L-C2] 실험 환경용 local profile (설정 등급, SPRING_PROFILES_ACTIVE=local)
#
# application.yml(upstream)은 그대로 두고 이 파일이 덮어쓴다.
# - DB: Postgres -> MySQL 8.4. 스키마 소유자는 MySQL init SQL 하나다(ddl-auto none, sql.init never).
# - Eureka를 끄고 Feign 대상 주소를 simple discovery로 고정한다. 주소는 env로 받아
#   legacy/new가 같은 파일을 쓴다.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    discovery:
      client:
        simple:
          instances:
            "[CART-SERVICE]":
              - uri: ${CART_SERVICE_URI}
            "[IDENTITY-SERVICE]":
              - uri: ${IDENTITY_SERVICE_URI}
            "[COUPON-SERVICE]":
              - uri: ${COUPON_SERVICE_URI}
            "[INVENTORY-SERVICE]":
              - uri: ${INVENTORY_SERVICE_URI}
            "[PAYMENT-SERVICE]":
              - uri: ${PAYMENT_SERVICE_URI}
            "[AUDIT-SERVICE]":
              - uri: ${AUDIT_SERVICE_URI}
            "[SHIPPING-SERVICE]":
              - uri: ${SHIPPING_SERVICE_URI}
            # [LEGACY_CHANGES L-F2] 알림 발송이 payment에서 order consumer로 옮겨왔다
            "[NOTIFICATION-SERVICE]":
              - uri: ${NOTIFICATION_SERVICE_URI}

eureka:
  client:
    enabled: false

# [LEGACY_CHANGES L-I1] 시각 고정. 비어 있으면 시스템 시각(UTC). config/ClockConfig 참조.
app:
  fixed-clock: ${APP_FIXED_CLOCK:}

# [LEGACY_CHANGES L-F2] PaymentCompleted 이벤트 소비. 브로커는 스택마다 하나라 토픽·group 이름이 두 스택에서 같다.
# earliest: S0 리셋으로 브로커가 새로 뜨면 커밋된 offset이 없으므로 처음부터 읽는다(리셋 뒤 첫 이벤트를 놓치지 않게).
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  consumer:
    auto-offset-reset: earliest
app.kafka:
  payment-events-topic: payment-events
  consumer-group: order-service
