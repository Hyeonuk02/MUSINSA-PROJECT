# [LEGACY_CHANGES L-C2] 실험 환경용 local profile (설정 등급, SPRING_PROFILES_ACTIVE=local)
#
# application.yml(upstream)은 그대로 두고 이 파일이 덮어쓴다.
# - DB: Postgres -> MySQL 8.4. 스키마 소유자는 MySQL init SQL 하나다(ddl-auto none, sql.init never).
# - Eureka를 끄고 Feign 대상 주소를 simple discovery로 고정한다. 주소는 env로 받아
#   legacy/new가 같은 파일을 쓴다.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    discovery:
      client:
        simple:
          instances:
            "[ORDER-SERVICE]":
              - uri: ${ORDER_SERVICE_URI}
            "[NOTIFICATION-SERVICE]":
              - uri: ${NOTIFICATION_SERVICE_URI}
            "[AUDIT-SERVICE]":
              - uri: ${AUDIT_SERVICE_URI}

eureka:
  client:
    enabled: false

# [LEGACY_CHANGES L-I1] 시각 고정. 비어 있으면 시스템 시각(UTC). config/ClockConfig 참조.
app:
  fixed-clock: ${APP_FIXED_CLOCK:}

# [LEGACY_CHANGES L-F1] Razorpay SDK 대신 가짜 PG(WireMock)를 HTTP로 호출한다(gateway/FakePgPaymentGateway).
# 이 값이 없으면(upstream 기본) RazorpayPaymentGateway가 SDK로 실제 Razorpay를 호출한다.
payment-gateway:
  type: fake
  fake-url: ${PAYMENT_GATEWAY_URL}

# [LEGACY_CHANGES L-F2] PaymentCompleted 이벤트 발행. 브로커는 스택마다 하나(스택 네트워크의 kafka)라
# 토픽 이름이 두 스택에서 같다. key/value는 문자열(Boot 기본 StringSerializer).
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
app.kafka:
  payment-events-topic: payment-events
