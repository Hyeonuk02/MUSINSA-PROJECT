# Phase 3.6 F8용: contract.yaml과 같고 max_selects에 order.get: 2만 선언(Legacy order.get = orders 1 + order_items 1).
# 같은 run을 이 파일로 다시 판정한다(verdict.py --contract). 클러스터 재실행 없음.
# Phase 3.4 — 기능 계약 선언 (D18). 검사 로직은 엔진(verdict.py)의 built-in이고, 여기서는 켜기·파라미터만 선언한다.
# 앱 코드를 import하지 않는다 — 엔드포인트는 method + path 정규식(또는 소비 토픽)으로 식별한다.
version: 1

endpoints:
  - {id: order.create,  method: POST, path: '^/api/orders$'}
  - {id: order.get,     method: GET,  path: '^/api/orders/by-key/[^/]+$'}
  - {id: order.pay,     method: POST, path: '^/api/orders/[^/]+/pay$'}
  - {id: order.cancel,  method: POST, path: '^/api/orders/[^/]+/cancel$'}
  - {id: coupon.create, method: POST, path: '^/api/coupons$'}
  - {id: coupon.get,    method: GET,  path: '^/api/coupons/by-key/[^/]+$'}
  - {id: coupon.use,    method: POST, path: '^/api/coupons/[^/]+/use$'}
  - {id: consume.order.paid, topic: order.paid}

# 관측 대상 — 이 호스트로 나간 호출·이 토픽 발행은 자식 홉 Evidence가 있어야 한다(hop 집합). barrier·verify와 같은 값.
observed:
  hosts: [order, coupon]
  topics: [order.paid]

checks:
  response_status_equal: {enabled: true}          # status 불일치는 무조건 CV — 규칙 예외 없음
  response_body_compatible: {enabled: true}       # 기존 필드 값 변경·삭제·content-type 변경 → CV (규칙이 그 diff를 설명하면 규칙을 따름). 필드 추가는 CV 아님
  write_set_equal: {enabled: true}
  tx_outcome_sequence_equal: {enabled: true}
  external_calls_equal: {enabled: true}           # 개수·순서·method·path·status·requestBodyHash
  events_equal: {enabled: true}                   # 발행·소비 이벤트 topic·key·ack(≠ ok면 CV)·payload(기존 필드 변경·삭제)
  error_equal: {enabled: true}
  consume_outcome_equal: {enabled: true}
  hop_set_equal: {enabled: true}
  publish_after_commit_begin: {enabled: true}     # 홉에 COMMIT_BEGIN이 있으면 모든 publish.seq > COMMIT_BEGIN.seq
  # 세션 범위 검사는 두 출력을 낸다(engine-v1.2): 차등 판정(CV) — Legacy와 다른 기여를 한 pair에만 귀속,
  # 절대 플래그(bothStacks) — 양쪽이 똑같이 위반하면 pair는 SAME, summary.sessionViolations에만 기록.
  gateway_calls_per_idem_key_le_1:                 # 세션 범위. 키별 호출 합이 스택 간 다르면 자기 pair 호출 수가 다른 pair에 CV, 같고 >1이면 bothStacks
    enabled: true
    host: wiremock
    path: /gateway/charge
  coupon_transition_order: {enabled: true}        # 세션 범위. 선행 use 200 없이 SETTLED가 New에서만 → 그 소비 홉 pair CV, 양쪽이면 bothStacks
  dbstate_equal: {enabled: true}                  # run 범위
  max_selects:                                     # 선언 단위 = endpoint id. 선언된 엔드포인트만 검사(기본 없음, F8에서 선언)
    enabled: true
    endpoints:
      order.get: 2
