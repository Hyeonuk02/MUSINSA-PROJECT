# Phase 0 nginx mirroring.
# 성능 튜닝 값(keepalive_requests 등)은 바꾸지 않는다. 이미지 기본 nginx.conf를 그대로 사용한다.

log_format mirror '$time_iso8601 "$request" status=$status '
                  'connection=$connection connection_requests=$connection_requests '
                  'request_id=$request_id upstream=$upstream_addr';

upstream legacy {
    server legacy:8080;
}

upstream new {
    server new:8080;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log mirror;

    location / {
        mirror /mirror;
        mirror_request_body on;

        proxy_set_header X-Replay-Request-Id $request_id;
        proxy_pass http://legacy;
    }

    location = /mirror {
        internal;

        proxy_set_header X-Replay-Request-Id $request_id;
        proxy_pass http://new$request_uri;
    }
}
