spring:
  application:
    name: order-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:poc}
    password: ${DB_PASSWORD:poc}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8080

# 비교 대상 application header 목록 (확정 목록은 추가 결정 필요 #2). 현재 값은 문서 예시.
request-log:
  headers: Content-Type,Idempotency-Key
