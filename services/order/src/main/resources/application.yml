spring:
  application:
    name: order-app
  datasource:
    # Phase 1.3a: MySQL 8. serverTimezone=UTC로 드라이버가 세션 타임존을 UTC로 고정한다
    # (JVM도 -Duser.timezone=UTC. Dockerfile 참조).
    url: ${DB_URL:jdbc:mysql://localhost:3306/orders?serverTimezone=UTC}
    username: ${DB_USER:poc}
    password: ${DB_PASSWORD:poc}
  sql:
    init:
      # 스키마 소유자는 MySQL의 /docker-entrypoint-initdb.d 하나뿐이다
      # (deploy/k8s/base/mysql-initdb/schema.sql). 앱은 DDL을 만들지 않는다.
      # emptyDir + init SQL 재실행이 곧 S0 리셋이라는 성질을 앱이 흐리지 않게 하기 위함.
      mode: never
  lifecycle:
    # graceful shutdown·Evidence drain 각 phase의 상한. k8s terminationGracePeriodSeconds(30s)보다 짧게.
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  # Phase 2.4: 진행 중 요청을 끝내고 멈춘다. 그 뒤 EvidenceSender가 큐를 drain(최대 10초)하고 남은 건 spill.
  # S0 리셋·재배포가 rollout restart라 매 run마다 pod가 종료되기 때문이다.
  shutdown: graceful

app:
  # 비어 있으면 시스템 시각(개발 편의). k8s에서는 APP_FIXED_CLOCK env로 주입한다.
  fixed-clock: ${APP_FIXED_CLOCK:}

payment:
  # Phase 2.1: 결제 게이트웨이(WireMock). k8s에서는 PAYMENT_GATEWAY_URL env로 같은 네임스페이스의 WireMock을 가리킨다.
  gateway-url: ${PAYMENT_GATEWAY_URL:http://localhost:8089}

# 비교 대상 application header 목록 (확정 목록은 추가 결정 필요 #2). 현재 값은 문서 예시.
request-log:
  headers: Content-Type,Idempotency-Key
