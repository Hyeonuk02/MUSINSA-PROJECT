spring:
  application:
    name: coupon-app
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coupons?serverTimezone=UTC}
    username: ${DB_USER:poc}
    password: ${DB_PASSWORD:poc}
  sql:
    init:
      # 스키마 소유자는 MySQL init SQL 하나(deploy/k8s/base/coupon-mysql-initdb/schema.sql). 앱은 DDL을 만들지 않는다.
      mode: never
  jpa:
    # 지연 로딩·SQL은 트랜잭션(서비스) 안에서만. hibernate.jdbc.batch_size 미설정(배치 off).
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

app:
  # 비어 있으면 시스템 시각(개발 편의). k8s에서는 APP_FIXED_CLOCK env로 주입한다.
  fixed-clock: ${APP_FIXED_CLOCK:}
